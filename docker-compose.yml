# Local development: `docker compose up -d postgres`, then `npm run dev`.
# Production on a server: `docker compose --profile prod up -d --build`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kezhia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kezhia}
      POSTGRES_DB: ${POSTGRES_DB:-kezhia}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kezhia} -d ${POSTGRES_DB:-kezhia}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ['prod']
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kezhia}:${POSTGRES_PASSWORD:-kezhia}@postgres:5432/${POSTGRES_DB:-kezhia}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://kezhia.online}
    # Only reachable from the server itself; put Caddy or Nginx in front for HTTPS.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
